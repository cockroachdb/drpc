name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Vet
        run: make vet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - name: Lint
        run: make lint
